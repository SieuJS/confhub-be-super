# /etc/nginx/nginx.conf (Hoàn chỉnh)

# XÓA HOẶC COMMENT DÒNG NÀY LẠI
# user www-data;

worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    # --- CẤU HÌNH CACHE ---
    # Định nghĩa một vùng cache tên là 'app_cache'
    # - keys_zone=app_cache:10m: Dành 10MB RAM để lưu trữ các key của cache.
    # - max_size=2g: Giới hạn kích thước cache trên đĩa là 2GB.
    # - inactive=60m: Xóa các mục cache không được truy cập trong 60 phút.
    # - use_temp_path=off: Ghi trực tiếp vào thư mục cache, tránh copy không cần thiết.
    # Đường dẫn này bây giờ trỏ đến thư mục được mount từ host
    proxy_cache_path /var/cache/nginx/app_cache levels=1:2 keys_zone=app_cache:10m max_size=2g inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri"; # Chìa khóa để định danh cache

    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off; # Ẩn phiên bản Nginx để tăng bảo mật

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # SSL Settings
    ##
    ssl_protocols TLSv1.2 TLSv1.3; # Chỉ giữ lại các giao thức mạnh
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    ##
    # Virtual Host Configs
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
    client_max_body_size 100M; # Giới hạn kích thước upload tối đa là 100MB
    client_header_timeout 1000s;
    client_body_timeout 1000s;
    send_timeout 1000s;
}