# ~/confhub-be-super/nginx.conf

# Server block cho HTTP port 80 (Giữ nguyên)
server {
    listen 80;
    listen [::]:80;
    server_name confhub.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server block cho HTTPS
server {
    listen 443 ssl; # Bỏ http2 để sửa lỗi deprecated, Nginx sẽ tự động dùng nếu có thể
    listen [::]:443 ssl;
    http2 on; # Cách làm mới để bật HTTP/2
    server_name confhub.ddns.net;

    # Cấu hình SSL (Giữ nguyên)
    ssl_certificate /etc/letsencrypt/live/confhub.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/confhub.ddns.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

     # Header để debug cache
    add_header X-Proxy-Cache $upstream_cache_status;

    # --- CÁC LOCATION PROXY ---

    # Location 1: API ĐỌC DỮ LIỆU (CACHE)
    location ~ ^/database/api/v1/(conferences|journals) {
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_cache app_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        rewrite ^/database/(.*)$ /$1 break;
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_connect_timeout 1000s;
        proxy_send_timeout 1000s;
        proxy_read_timeout 1000s;
        send_timeout 1000s;
    }

    # Location 2: API còn lại (KHÔNG CACHE)
    location /database/ {
        rewrite ^/database/(.*)$ /$1 break;
        proxy_pass http://server:3000;
        # ... các header proxy đầy đủ ...
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50M;
        proxy_connect_timeout 1000s;
        proxy_send_timeout 1000s;
        proxy_read_timeout 1000s;
        send_timeout 1000s;
    }

    # Location 3: Location gốc cho Frontend
location / {
    # --- TẠM THỜI VÔ HIỆU HÓA TOÀN BỘ LOGIC CACHE ---
    # set $nocache 1;
    # set $cache_condition "";
    # if ($request_method = GET) {
    #     set $cache_condition "${cache_condition}G";
    # }
    # if ($uri ~* "^/[a-z]{2}(/|/conferences|/journals|/conferences/detail|/journals/detail)?$") {
    #     set $cache_condition "${cache_condition}U";
    # }
    # if ($http_cookie !~* "(connect.sid|auth_token)") {
    #     set $cache_condition "${cache_condition}C";
    # }
    # if ($cache_condition = "GUC") {
    #     set $nocache 0;
    # }
    # proxy_cache_bypass $nocache;
    # proxy_no_cache $nocache;
    # proxy_cache app_cache;
    # proxy_cache_valid 200 2m;
    # --- KẾT THÚC VÔ HIỆU HÓA ---

    # Các header proxy đầy đủ cho frontend
    proxy_pass http://host.docker.internal:8386;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    client_max_body_size 50M;
}
    # Location 4: Các backend khác (KHÔNG CACHE)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://host.docker.internal:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 50M;
    }
    
    location /admin/ {
        proxy_pass http://host.docker.internal:1314;
        # ... các header proxy đầy đủ ...
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        client_max_body_size 50M;
    }
}