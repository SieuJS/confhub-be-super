# postgres-config/postgresql.conf

# ====================================================================================
# FILE LOCATION: ./postgres-config/postgresql.conf
#
# Đây là file cấu hình tùy chỉnh cho PostgreSQL để tối ưu hiệu năng và logging.
# ====================================================================================


#------------------------------------------------------------------------------
# FILE LOCATIONS
#------------------------------------------------------------------------------

# ĐIỀU CHỈNH QUAN TRỌNG: Chỉ định đường dẫn đến các file và thư mục cấu hình
data_directory = '/bitnami/postgresql/data'
hba_file = '/bitnami/postgresql/conf/pg_hba.conf'
ident_file = '/bitnami/postgresql/conf/pg_ident.conf'
external_pid_file = '/opt/bitnami/postgresql/tmp/postgresql.pid'


#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'       # Chấp nhận kết nối từ mọi IP (Docker network sẽ quản lý)
max_connections = 300        # Tăng giới hạn kết nối để phục vụ backend cluster


#------------------------------------------------------------------------------
# RESOURCE USAGE (MEMORY)
#------------------------------------------------------------------------------

shared_buffers = 2GB                  # Quy tắc chung: 25% tổng RAM của server
effective_cache_size = 4GB            # Quy tắc chung: 75% tổng RAM của server
maintenance_work_mem = 256MB          # Tăng RAM cho tác vụ bảo trì (VACUUM, CREATE INDEX)
work_mem = 16MB                       # Tăng RAM cho mỗi thao tác sắp xếp, join, hash


#------------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL)
#------------------------------------------------------------------------------

wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB


#------------------------------------------------------------------------------
# ERROR REPORTING AND LOGGING
#------------------------------------------------------------------------------

logging_collector = on                # Bật bộ thu thập log
log_directory = 'pg_log'              # Thư mục lưu log bên trong volume dữ liệu
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log' # Tên file log theo ngày giờ

# --- Cấu hình quan trọng để tìm SLOW QUERIES ---
log_min_duration_statement = 500ms    # Log tất cả các câu query chạy lâu hơn 500ms

# --- Cấu hình hữu ích khác để debug ---
log_checkpoints = on
log_connections = on                  # Log khi có kết nối mới
log_disconnections = on               # Log khi kết nối bị đóng
log_lock_waits = on                   # Log khi có transaction phải chờ vì bị khóa
log_statement = 'ddl'                 # Log các câu lệnh CREATE, ALTER, DROP
log_timezone = 'UTC'


#------------------------------------------------------------------------------
# OTHER SETTINGS
#------------------------------------------------------------------------------

effective_io_concurrency = 200        # Cho ổ đĩa SSD NVMe
random_page_cost = 1.1                # Cho ổ đĩa SSD